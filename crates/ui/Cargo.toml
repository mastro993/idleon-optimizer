[package]
name = "idleon-ui"
description = "Shared GPUI building blocks: the background task runner, run chrome, formula trees, number formatting, the composites and form controls GPUI Kit lacks, the table column widths and the rows table delegate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gpui = { workspace = true }
gpui-kit = { workspace = true }
idleon-common = { workspace = true }
log = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
