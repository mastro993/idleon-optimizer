name: CI

on:
  push:
    branches: [main]
    # Docs and assets are skipped, except the files a Rust test reads: the
    # roadmap and section specs (the registry tests) and the asset manifest
    # (the combat replay test). Later patterns override earlier ones.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!assets/**'
      - 'docs/roadmap.json'
      - 'docs/sections/**'
      - 'assets/game/manifest.json'
  # Every pull request runs: `fmt`, `clippy` and `test` are required checks, and
  # a workflow that never starts never reports them. The `changes` job decides
  # whether the gates have anything to build.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job reads the repository and nothing else; `changes` adds the one
# extra read scope its filter needs.
permissions:
  contents: read

jobs:
  # One cheap runner decides whether the expensive matrix has anything to look
  # at, so a change confined to the harness scripts does not start the macOS
  # jobs.
  changes:
    runs-on: ubuntu-24.04
    # `paths-filter` lists the PR's changed files through the API, which the
    # default token cannot read on a private repository.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'crates/**/data/**'
              - 'fixtures/**'
              - '.github/workflows/**'
              - 'docs/roadmap.json'
              - 'docs/sections/**'
              - 'assets/game/manifest.json'
              # The bridge submodule: a bump changes only the gitlink.
              - 'vendor/gpui-mcp'
              - '.gitmodules'

  # The gates always run so their checks report: with no Rust change every
  # step is skipped on a Linux runner, which reports success in seconds instead
  # of starting a macOS job. A job-level `if` would skip the whole matrix, which
  # then never reports the `fmt`, `clippy` and `test` names the ruleset requires.
  # Everything runs at once; the first failure cancels the rest, so a broken
  # `main` never pays for the remaining macOS jobs.
  static:
    needs: changes
    strategy:
      fail-fast: true
      matrix:
        include:
          # Formatting needs no build, no cache and no submodule: cheapest runner.
          - label: fmt
            os: ubuntu-24.04
            submodules: false
            cache: false
            command: cargo fmt --all -- --check
          # Clippy compiles the workspace, whose GUI comes from the vendored
          # gpui-pre snapshot (objc2/metal), so it runs where a developer does.
          # The second pass keeps the build without the automation bridge
          # compiling.
          - label: clippy
            os: macos-latest
            submodules: recursive
            cache: macos-clippy
            command: >-
              cargo clippy --workspace --all-targets -- -D warnings &&
              cargo clippy -p idleon-optimizer --no-default-features --all-targets -- -D warnings
          # One job: the suite runs in about a minute, while every shard would
          # build the whole workspace again, so a shard only adds a build.
          - label: test
            os: macos-latest
            submodules: recursive
            cache: macos-test
            nextest: true
            command: cargo nextest run --workspace
    name: ${{ matrix.label }}
    runs-on: ${{ needs.changes.outputs.rust == 'true' && matrix.os || 'ubuntu-24.04' }}
    steps: &steps
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ matrix.submodules }}
          persist-credentials: false
      # Pinned to the workspace's rust-version so a new stable clippy lint cannot
      # turn -D warnings red on a branch that changed nothing. The action is
      # pinned by commit; `toolchain` names the version.
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - if: needs.changes.outputs.rust == 'true' && matrix.nextest
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: nextest
      # Clippy keeps check metadata and tests keep `test`-profile libraries, so
      # one shared bucket held only whichever saved first and the other rebuilt
      # every dependency. Only `main` saves: pull requests restore its caches
      # instead of filling the quota with their own. The root manifest's
      # `[profile]` tables are not part of the key, so rename a bucket when they
      # change.
      - if: needs.changes.outputs.rust == 'true' && matrix.cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.rust == 'true'
        run: ${{ matrix.command }}

  # The long simulations are `#[ignore]`d so pull requests skip them; `main`
  # runs them beside the gates. The one-entry matrix feeds the gates' steps,
  # reused through the anchor, so it shares the toolchain and the test cache.
  simulations:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest
            submodules: recursive
            cache: macos-test
            nextest: true
            command: cargo nextest run --workspace --run-ignored only
    # A skipped job never expands `matrix.label`, so the name is literal.
    name: simulations
    runs-on: ${{ matrix.os }}
    steps: *steps
