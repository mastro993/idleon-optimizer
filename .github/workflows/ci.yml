name: CI

on:
  push:
    branches: [main]
    # Docs and assets change no code the gates can see: no run at all.
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the same Ubuntu image: Linux minutes are the cheapest the
# plan has, and no gate needs a macOS host.
jobs:
  # One cheap runner decides whether the expensive matrix has anything to look
  # at, so a change confined to the harness scripts or the workflow files does
  # not start three build jobs.
  changes:
    runs-on: ubuntu-24.04
    # `paths-filter` lists the PR's changed files through the API, which the
    # default token cannot read on a private repository.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'crates/**/data/**'
              - 'fixtures/**'
              - '.github/workflows/**'

  static:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Everything runs at once; the first failure cancels the rest, so a broken
    # `main` never pays for the remaining jobs.
    strategy:
      fail-fast: true
      matrix:
        include:
          # Formatting needs no build, no cache and no submodule: cheapest runner.
          - label: fmt
            submodules: false
            deps: false
            cache: false
            command: cargo fmt --all -- --check
          # The GUI comes from the vendored gpui-pre snapshot. Its Linux backend
          # links the x11/wayland/font libraries, and clippy builds every target,
          # so the compiling jobs install them with apt below.
          - label: clippy
            submodules: recursive
            deps: true
            cache: true
            command: cargo clippy --workspace --all-targets -- -D warnings
          # Tests shard by test, not by crate, so one cache bucket keeps serving
          # both shards and clippy (two buckets would evict each other).
          - label: test 1/2
            submodules: recursive
            deps: true
            cache: true
            nextest: true
            command: cargo nextest run --workspace --partition count:1/2
          - label: test 2/2
            submodules: recursive
            deps: true
            cache: true
            nextest: true
            command: cargo nextest run --workspace --partition count:2/2
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.submodules }}
      # Only the jobs that compile need these: they are the link-time system
      # libraries gpui-pre's Linux backend names in its manifest (wayland
      # client_system, x11rb over libxcb, fontconfig/freetype for font-kit).
      - if: matrix.deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev libexpat1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libwayland-dev
      # Pinned to the workspace's rust-version so a new stable clippy lint cannot
      # turn -D warnings red on a branch that changed nothing.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      # nextest ships the sharding (`--partition count:n/N`); no script of ours.
      - if: matrix.nextest
        uses: taiki-e/install-action@nextest
      - if: matrix.cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
      - run: ${{ matrix.command }}
