name: CI

on:
  push:
    branches: [main]
    # Docs and assets change no code the gates can see.
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    # Both gates run at once; the first failure cancels the other, so a broken
    # `main` never costs a full clippy run after a one-second fmt failure.
    strategy:
      fail-fast: true
      matrix:
        include:
          # Formatting needs no build, no cache and no submodule: cheapest runner.
          - check: fmt
            os: ubuntu-24.04
            submodules: false
            command: cargo fmt --all -- --check
          # Clippy compiles the workspace, whose GUI comes from the vendored
          # gpui-pre snapshot (objc2/metal), so it runs where a developer does.
          - check: clippy
            os: macos-latest
            submodules: recursive
            command: cargo clippy --workspace --all-targets -- -D warnings
          # Same build tree as clippy: one shared cache bucket, not two that
          # evict each other under the repository's cache limit.
          - check: test
            os: macos-latest
            submodules: recursive
            command: cargo test --workspace
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.submodules }}
      # Pinned to the workspace's rust-version so a new stable clippy lint cannot
      # turn -D warnings red on a branch that changed nothing.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - if: matrix.check != 'fmt'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-workspace
      - run: ${{ matrix.command }}
