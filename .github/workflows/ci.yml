name: CI

on:
  push:
    branches: [main]
    # Docs and assets change no code the gates can see: no run at all.
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One cheap runner decides whether the expensive matrix has anything to look
  # at, so a change confined to the harness scripts does not start the macOS
  # jobs.
  changes:
    runs-on: ubuntu-24.04
    # `paths-filter` lists the PR's changed files through the API, which the
    # default token cannot read on a private repository.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - 'crates/**/data/**'
              - 'fixtures/**'
              - '.github/workflows/**'

  static:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Everything runs at once; the first failure cancels the rest, so a broken
    # `main` never pays for the remaining macOS jobs. The compiling jobs take the
    # 5-core M2 runner over the 3-core default: the build is CPU-bound, so more
    # cores shorten it directly.
    strategy:
      fail-fast: true
      matrix:
        include:
          # Formatting needs no build, no cache and no submodule: cheapest runner.
          - label: fmt
            os: ubuntu-24.04
            submodules: false
            cache: false
            command: cargo fmt --all -- --check
          # Clippy compiles the workspace, whose GUI comes from the vendored
          # gpui-pre snapshot (objc2/metal), so it runs where a developer does.
          - label: clippy
            os: macos-latest-xlarge
            submodules: recursive
            cache: macos-clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          # One job: the suite runs in about a minute, while every shard would
          # build the whole workspace again, so a shard only adds a build.
          - label: test
            os: macos-latest-xlarge
            submodules: recursive
            cache: macos-test
            nextest: true
            command: cargo nextest run --workspace
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps: &steps
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.submodules }}
      # Pinned to the workspace's rust-version so a new stable clippy lint cannot
      # turn -D warnings red on a branch that changed nothing.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - if: matrix.nextest
        uses: taiki-e/install-action@nextest
      # Clippy keeps check metadata and tests keep `test`-profile libraries, so
      # one shared bucket held only whichever saved first and the other rebuilt
      # every dependency. Only `main` saves: pull requests restore its caches
      # instead of filling the quota with their own. The root manifest's
      # `[profile]` tables are not part of the key, so rename a bucket when they
      # change.
      - if: matrix.cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ${{ matrix.command }}

  # The long simulations are `#[ignore]`d so pull requests skip them; `main`
  # runs them beside the gates. The one-entry matrix feeds the gates' steps,
  # reused through the anchor, so it shares the toolchain and the test cache.
  simulations:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.rust == 'true'
    strategy:
      matrix:
        include:
          - os: macos-latest-xlarge
            submodules: recursive
            cache: macos-test
            nextest: true
            command: cargo nextest run --workspace --run-ignored only
    # A skipped job never expands `matrix.label`, so the name is literal.
    name: simulations
    runs-on: ${{ matrix.os }}
    steps: *steps
