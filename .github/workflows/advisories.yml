name: Advisories

on:
  schedule:
    # Mondays 06:00 UTC: a new advisory needs no code change to appear.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.lock", "deny.toml", ".github/workflows/advisories.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories sources
