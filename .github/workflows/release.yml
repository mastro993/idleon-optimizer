name: Release

# Cut a release by hand from the Actions tab: bump the version, build every
# platform, then push the bump commit and its tag to `main` and publish the
# GitHub release. Nothing is pushed unless every platform built. The push
# bypasses the `main` ruleset with the RELEASE_DEPLOY_KEY deploy key. See
# docs/release.md.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (X.Y.Z, newer than the current one)
        type: string
        required: false

# One release at a time, nightlies included: they all create tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: next
        run: |
          version=$(node script/version.mjs next "${VERSION:-$BUMP}")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The deploy key is what may push to `main`; the job token only creates
      # the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      # The commit holds exactly the tree the build stamped. A push that is
      # not a fast-forward (main moved during the build) fails and publishes
      # nothing; dispatch again.
      - run: |
          node script/version.mjs set "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --all --message "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "v$VERSION" --verify-tag --latest \
            --title "Idleon Optimizer v$VERSION" \
            --notes-file .github/release-notes.md --generate-notes \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
