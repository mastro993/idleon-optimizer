[workspace]
members = ["crates/*"]
# The automation bridge is a nested workspace checked out as a submodule. Keeping
# it out of this one lets it inherit its own package metadata and lets the GPUI
# patches below point at its vendored tree.
exclude = ["vendor/gpui-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# One GPUI snapshot for the app, Ely and the automation bridge. gpui-pre 0.3.9
# is the newest snapshot the bridge vendors; Ely at the pinned rev takes the
# same one, so no two copies of GPUI end up in the graph.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = [
  "font-kit",
  "wayland",
  "x11",
] }
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "28e56904580a014cf088231bd6239f6b7ea133b7" }
gpui-mcp = { path = "vendor/gpui-mcp/crates/gpui-mcp", default-features = false, features = [
  "gpui-pre",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# Correctly rounded float parsing: a save or project read back from its own
# export keeps every f64 bit, instead of drifting by an ULP on long decimals.
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
jiff = "0.2"
directories = "6"
base64 = "0.22"
flate2 = "1"

idleon-common = { path = "crates/common" }
idleon-save = { path = "crates/save" }
idleon-prisma = { path = "crates/prisma" }
idleon-drop-rate = { path = "crates/drop-rate" }
idleon-damage = { path = "crates/damage" }
idleon-coin-multi = { path = "crates/coin-multi" }
idleon-stats = { path = "crates/stats" }
idleon-research = { path = "crates/research" }
idleon-stats-data = { path = "crates/stats-data" }
idleon-account = { path = "crates/account" }
idleon-minehead = { path = "crates/minehead" }
idleon-import = { path = "crates/import" }
idleon-project = { path = "crates/project" }
idleon-ui = { path = "crates/ui" }
idleon-clamworks = { path = "crates/clamworks" }
idleon-royal-guardian = { path = "crates/royal-guardian" }
idleon-spelunking = { path = "crates/spelunking" }
idleon-sneaking = { path = "crates/sneaking" }
idleon-monument = { path = "crates/monument" }
idleon-killroy = { path = "crates/killroy" }
idleon-jelly = { path = "crates/jelly" }
idleon-fishing = { path = "crates/fishing" }
idleon-worship = { path = "crates/worship" }
idleon-statue = { path = "crates/statue" }
idleon-sailing = { path = "crates/sailing" }
idleon-opal = { path = "crates/opal" }
idleon-ladle = { path = "crates/ladle" }
idleon-jar = { path = "crates/jar" }
idleon-fountain = { path = "crates/fountain" }
idleon-farming = { path = "crates/farming" }
idleon-endgame = { path = "crates/endgame" }
idleon-coral = { path = "crates/coral" }
idleon-cooking-mastery = { path = "crates/cooking-mastery" }
idleon-combat = { path = "crates/combat" }
idleon-cog = { path = "crates/cog" }
idleon-cglunko = { path = "crates/cglunko" }
idleon-pickle = { path = "crates/pickle" }

# The bridge's GPUI carries the accessibility ids and roles it reads; patch the
# registry snapshot to that tree so the app, the platform crate and the bridge
# compile against one GPUI.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-mcp/vendor/gpui-pre" }
